name: PRISM
options:
  bundleIdPrefix: com.cortexnode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  PRISM:
    type: application
    platform: iOS
    sources:
      - PRISM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cortexnode.prism
        PRODUCT_NAME: "PRISM"
        INFOPLIST_FILE: PRISM/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
